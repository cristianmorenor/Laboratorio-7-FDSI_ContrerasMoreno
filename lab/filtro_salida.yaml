# Blue Team - control FUERA del modelo: filtro de salida (DLP) aplicado por el "servidor".
# Usa el prompt VULNERABLE a propósito: demuestra que el control funciona aunque el prompt sea débil.
#   npx promptfoo@latest eval -c filtro_salida.yaml --no-cache
description: FDSI AI Security Arena - prompt vulnerable + filtro de salida en servidor

prompts:
  - id: file://prompts/vulnerable.txt
    label: 'vulnerable_con_filtro'

providers:
  - id: ollama:chat:llama3.2:3b
    config:
      temperature: 0.7
      num_predict: 400

defaultTest:
  options:
    transform: file://asserts/filtro_salida.js   # se aplica a la salida ANTES de las aserciones
  assert:
    - type: javascript
      value: file://asserts/fuga_marcador.js

tests: file://tests/misiones.yaml
